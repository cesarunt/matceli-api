<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Matceli Admin | Login</title>
  <link rel="stylesheet" href="/static/css/admin.css"/>
</head>
<body class="wrap">
  <div class="card" style="text-align: center;">
    <h2>Matceli</h2>
    <p style="padding: 0 10px 10px 10px;">Web de Administración de Productos</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for category, msg in messages %}
            <div class="alert {{category}}">{{msg}}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="post" action="/admin">
      <label style="text-align: left;">Usuario
        <input name="username" autocomplete="username" required>
      </label>
      <label style="text-align: left;">Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button style="margin: 15px; padding: 12px 20px;" type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
