<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matceli | Cup Cakes</title>
  <link rel="stylesheet" href="/static/css/frontend_main.css" />
  <link rel="stylesheet" href="/static/css/frontend_products.css" />
</head>

<body>
  <div class="topbar">
    <p>Pedidos y delivery con 48h de anticipación</p>
  </div>

  <header class="header">
    <div class="container header__inner">
      <button class="icon-btn header__menu" aria-label="Abrir menú">
        <span class="hamburger" aria-hidden="true"></span>
      </button>

      <a class="brand" href="{{ url_for('index') }}" aria-label="Ir al inicio">
        <img src="/static/images/matceli-logoweb.png" alt="Matceli Pastelería" class="brand__logo">
      </a>

      <nav class="nav" aria-label="Navegación principal">
        <a href="{{ url_for('index') }}#inicio">Inicio</a>
        <a href="{{ url_for('index') }}#catalogo" class="active">Catálogo</a>
        <a href="{{ url_for('index') }}#proceso">Proceso de Compra</a>
        <a href="{{ url_for('index') }}#clientes">Clientes</a>
        <a href="{{ url_for('index') }}#contacto">Contacto</a>
      </nav>

      <div class="header__actions">
        <button class="icon-btn" aria-label="Cuenta">👤</button>
      </div>
    </div>
  </header>

  <main>
    <!-- Breadcrumb + título -->
    <section class="section">
      <div class="container">
        <div class="crumbs">
          <a href="{{ url_for('index') }}#inicio">Inicio</a>
          <span>›</span>
          <a href="{{ url_for('index') }}#catalogo">Catálogo</a>
          <span>›</span>
          <strong>Cup Cakes</strong>
        </div>

        <header class="section__head">
          <div>
            <h2>Cup Cakes</h2>
            <p class="muted">Explora diseños y solicita tu personalización (tema, colores, porciones, fecha).</p>
          </div>

          <div class="filters">
            <select aria-label="Filtrar por ocasión">
              <option value="all">Toda ocasión</option>
              <option value="cumple">Cumpleaños</option>
              <option value="anual">Aniversario</option>
              <option value="corp">Corporativo</option>
            </select>
          </div>
        </header>

        <!-- Grid productos -->
        <div class="grid products products--category">

          <script>
          (async () => { 
            const API = "https://matceli-api.onrender.com/api/products?category=cupcakes";
            // const API = "http://localhost:5000/api/products?category=cupcakes";
            const res = await fetch(API);
            const items = await res.json();

            const grid = document.querySelector(".products");
            grid.innerHTML = items.map(p => `
              <article class="product">
                <div class="product__img" style="background-image:url('${p.image_url || ''}')"></div>
                <div class="product__body">
                  <h3 class="product__name">${p.name}</h3>
                  <p class="muted">${p.short_desc || ''}</p>
                  <div class="product__actions">
                    <a class="btn btn--quote js-cotizar" href="#">Cotizar</a>
                  </div>
                </div>
              </article>
            `).join("");
          })();
          </script>
        
        </div>

      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <p class="muted">© 2026 MATCELI, todos los derechos reservados.</p>
    </div>
  </footer>

  <script>
    // ✅ Tu número en formato internacional (Perú = 51 + número)
    const WHATSAPP_NUMBER = "51930888299";

    function openWhatsAppQuote(productName) {
      const text = `Hola Matceli, estoy interesado en el producto *${productName}*`;
      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
      window.open(url, "_blank");
    }
    
    // ✅ Delegación: funciona aunque los botones se creen dinámicamente
    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".js-cotizar");
      if (!btn) return;

      e.preventDefault();
      // Busca el nombre dentro de la misma tarjeta del botón
      const card = btn.closest(".product-card, .card, article, li, .product");
      const titleEl = card?.querySelector(".product__name, .product__title, h3, h4, .title");
      const productName = titleEl?.textContent?.trim() || "este cupcake";

      openWhatsAppQuote(productName);
    });

  </script>

</body>
</html>
